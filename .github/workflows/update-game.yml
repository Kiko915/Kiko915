name: Profile Art

on:
  schedule:
    - cron: '17 2 * * *' # daily, a little after midnight UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'game/**'
      - 'stats/**'
      - '.github/workflows/update-game.yml'

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: game/package-lock.json

      - name: Install dependencies
        working-directory: game
        run: npm ci

      - name: Render game.gif
        working-directory: game
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
          SCENE: swinger
          OUT_PATH: ../game.gif
        run: node generate.mjs

      - name: Render stats panels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
          # Repos whose vendored bytes would otherwise dominate the language
          # breakdown. Comma separated, matched case-insensitively.
          EXCLUDE_REPOS: ''
        run: node stats/generate.mjs

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain -- game.gif stats.svg langs.svg streak.svg)" ]; then
            echo "Nothing changed - skipping commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game.gif stats.svg langs.svg streak.svg
          git commit -m 'chore(profile): refresh generated art'
          git push
